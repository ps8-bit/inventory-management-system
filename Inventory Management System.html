  <!-- Register service worker so the app is installable as a standalone PWA -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        // Was a SW already controlling this page? If so, a later controllerchange is a
        // genuine UPDATE (not first install) and we reload once to pick up fresh code.
        var hadController = !!navigator.serviceWorker.controller;
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (reloaded || !hadController) return;
          reloaded = true;
          window.location.reload();
        });
        navigator.serviceWorker.register("/sw.js").then(function (reg) {
          try { reg.update(); } catch (e) {}            // check for a new SW now
          // And re-check whenever the app regains focus (covers installed PWAs).
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") { try { reg.update(); } catch (e) {} }
          });
        }).catch(function (err) {
          console.warn("SW registration failed:", err);
        });
      });
    }
  </script>
